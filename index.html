<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Códigos de Barras</title>
    <!-- 1. Importar la librería -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #lector-barras {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: none; /* Oculto hasta que se encienda la cámara */
        }
        .controles button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 18px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Escáner de Código de Barras</h2>
    
    <!-- Contenedor del video de la cámara -->
    <div id="lector-barras"></div>

    <div class="controles">
        <button onclick="iniciarEscaner()">📷 Iniciar Escáner</button>
        <button onclick="detenerEscaner()">⏹ Detener</button>
    </div>

    <div>
        <p>Código detectado:</p>
        <input type="text" id="resultado" placeholder="Esperando código..." readonly>
    </div>

    <script>
        let escaner;

        function iniciarEscaner() {
            const contenedor = document.getElementById('lector-barras');
            contenedor.style.display = 'block';

            if (!escaner) {
                escaner = new Html5Qrcode("lector-barras");
            }

            // Configuración optimizada para códigos de barras
            const config = { 
                fps: 10, 
                // Hacer el área de escaneo rectangular (más ancha que alta)
                qrbox: { width: 300, height: 150 } 
            };

            escaner.start(
                { facingMode: "environment" }, // Usa la cámara trasera en móviles
                config,
                (textoDecodificado) => {
                    // Acción al leer con éxito
                    document.getElementById('resultado').value = textoDecodificado;
                    
                    // Opcional: Detener la cámara tras la lectura exitosa
                    detenerEscaner();
                },
                (mensajeError) => {
                    // Errores de lectura por cada frame (se ignoran silenciosamente)
                }
            ).catch((err) => {
                console.error("Error al iniciar la cámara:", err);
                alert("No se pudo iniciar la cámara.");
            });
        }

        function detenerEscaner() {
            if (escaner && escaner.isScanning) {
                escaner.stop().then(() => {
                    document.getElementById('lector-barras').style.display = 'none';
                }).catch((err) => {
                    console.error("Error al detener:", err);
                });
            }
        }
    </script>
</body>
</html>
