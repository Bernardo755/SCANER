<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Pies de Madera</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <header class="bg-amber-800 text-white p-6 rounded-xl shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">🪵 Calculadora de Madera</h1>
        <p class="text-amber-200 text-sm">Cálculo de pies tablares e integración con Google Sheets</p>
      </div>
      <button onclick="consultarHistorial()" class="bg-amber-700 hover:bg-amber-600 px-4 py-2 rounded-lg text-sm font-semibold transition border border-amber-500">
        📋 Consultar Guardados
      </button>
    </header>

    <main class="bg-white rounded-xl shadow-md p-6 space-y-6">
      
      <div>
        <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">Título o Referencia del Cálculo *</label>
        <input type="text" id="titulo" placeholder="Ej: Pedido Cliente Perez - Comedor" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b text-xs uppercase text-slate-500 font-semibold">
              <th class="p-3">Largo (Pies / Ft)</th>
              <th class="p-3">Ancho (Pulg. / In)</th>
              <th class="p-3">Grosor (Pulg. / In)</th>
              <th class="p-3">Cantidad</th>
              <th class="p-3">Pies / Tabla</th>
              <th class="p-3">Subtotal Pies</th>
              <th class="p-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="filas-madera" class="divide-y divide-slate-100 text-sm">
            </tbody>
        </table>
      </div>

      <div class="flex flex-wrap justify-between items-center gap-4 pt-4 border-t">
        <button onclick="agregarFila()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-1">
          ➕ Agregar Medida
        </button>

        <div class="flex items-center gap-4">
          <button onclick="limpiarFormulario()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg transition">
            🧹 Limpiar Todo
          </button>
          <button onclick="guardarEnSheets()" class="bg-amber-700 hover:bg-amber-800 text-white font-bold px-6 py-2 rounded-lg transition shadow-md flex items-center gap-2">
            💾 Guardar Registro
          </button>
        </div>
      </div>

      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex justify-between items-center text-amber-900">
        <span class="text-lg font-semibold">Total de Pies Tablares:</span>
        <span id="total-general" class="text-3xl font-extrabold">0.00 PT</span>
      </div>

    </main>

    <div id="modal-historial" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
      <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[85vh] flex flex-col overflow-hidden">
        <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
          <h2 class="text-lg font-bold">📋 Registros Guardados (BIT MADERA)</h2>
          <button onclick="cerrarHistorial()" class="text-slate-400 hover:text-white font-bold text-xl">&times;</button>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
          <div id="loading-historial" class="text-center py-8 text-slate-500">Cargando datos de Google Sheets...</div>
          <table id="tabla-historial" class="hidden w-full text-xs text-left border-collapse">
            <thead class="bg-slate-100 text-slate-600 sticky top-0">
              <tr id="headers-historial"></tr>
            </thead>
            <tbody id="body-historial" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    // URL desplegada del script de Google Apps Script
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx6JQeAHDQxdY35zH5NZKQwE1Qbd1zMobPala6QMnmxeHJFVkCUrGDpfAf89XaRjWTbXA/exec";

    // Inicializar app con una fila vacía
    document.addEventListener("DOMContentLoaded", () => {
      agregarFila();
    });

    // Agregar nueva fila de entrada de medidas
    function agregarFila() {
      const tbody = document.getElementById("filas-madera");
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td class="p-2"><input type="number" step="0.01" class="largo border border-slate-300 rounded p-1.5 w-full focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Pies" oninput="calcularTotales()"></td>
        <td class="p-2"><input type="number" step="0.01" class="ancho border border-slate-300 rounded p-1.5 w-full focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Pulgadas" oninput="calcularTotales()"></td>
        <td class="p-2"><input type="number" step="0.01" class="grosor border border-slate-300 rounded p-1.5 w-full focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Pulgadas" oninput="calcularTotales()"></td>
        <td class="p-2"><input type="number" step="1" min="1" class="cantidad border border-slate-300 rounded p-1.5 w-full focus:ring-2 focus:ring-amber-500 outline-none" value="1" oninput="calcularTotales()"></td>
        <td class="p-2 font-medium text-slate-600 pies-unitarios">0.00</td>
        <td class="p-2 font-bold text-amber-800 pies-subtotal">0.00</td>
        <td class="p-2 text-center">
          <button onclick="eliminarFila(this)" class="text-rose-500 hover:text-rose-700 font-bold px-2 py-1 rounded hover:bg-rose-50">✕</button>
        </td>
      `;

      tbody.appendChild(tr);
      calcularTotales();
    }

    // Eliminar una fila
    function eliminarFila(btn) {
      const tbody = document.getElementById("filas-madera");
      if (tbody.children.length > 1) {
        btn.closest("tr").remove();
        calcularTotales();
      } else {
        alert("Debe existir al menos un registro de medida.");
      }
    }

    // Calcular pies tablares por fila y el total general
    function calcularTotales() {
      const filas = document.querySelectorAll("#filas-madera tr");
      let grandTotal = 0;

      filas.forEach(fila => {
        const largo = parseFloat(fila.querySelector(".largo").value) || 0;
        const ancho = parseFloat(fila.querySelector(".ancho").value) || 0;
        const grosor = parseFloat(fila.querySelector(".grosor").value) || 0;
        const cantidad = parseInt(fila.querySelector(".cantidad").value) || 0;

        // Fórmula: (Grosor (plg) * Ancho (plg) * Largo (ft)) / 12
        const piesUnitarios = (grosor * ancho * largo) / 12;
        const subtotalPies = piesUnitarios * cantidad;

        fila.querySelector(".pies-unitarios").textContent = piesUnitarios.toFixed(2);
        fila.querySelector(".pies-subtotal").textContent = subtotalPies.toFixed(2);

        grandTotal += subtotalPies;
      });

      document.getElementById("total-general").textContent = grandTotal.toFixed(2) + " PT";
    }

    // Limpiar formulario
    function limpiarFormulario() {
      document.getElementById("titulo").value = "";
      document.getElementById("filas-madera").innerHTML = "";
      agregarFila();
    }

    // Guardar en Google Sheets vía POST
    async function guardarEnSheets() {
      const titulo = document.getElementById("titulo").value.trim();

      if (!titulo) {
        alert("Por favor ingresa un título para identificar el cálculo.");
        return;
      }

      if (URL_APPS_SCRIPT === "TU_URL_DE_APPS_SCRIPT_AQUI" || !URL_APPS_SCRIPT) {
        alert("Primero debes configurar tu URL de Google Apps Script en el código JS.");
        return;
      }

      const filas = document.querySelectorAll("#filas-madera tr");
      const items = [];

      filas.forEach(fila => {
        const largo = parseFloat(fila.querySelector(".largo").value) || 0;
        const ancho = parseFloat(fila.querySelector(".ancho").value) || 0;
        const grosor = parseFloat(fila.querySelector(".grosor").value) || 0;
        const cantidad = parseInt(fila.querySelector(".cantidad").value) || 0;
        const piesPorTabla = parseFloat(fila.querySelector(".pies-unitarios").textContent);
        const subtotalPies = parseFloat(fila.querySelector(".pies-subtotal").textContent);

        if (largo > 0 && ancho > 0 && grosor > 0 && cantidad > 0) {
          items.push({ largo, ancho, grosor, cantidad, piesPorTabla, subtotalPies });
        }
      });

      if (items.length === 0) {
        alert("Ingresa al menos una medida válida antes de guardar.");
        return;
      }

      const totalGeneral = parseFloat(document.getElementById("total-general").textContent);

      const payload = {
        titulo: titulo,
        totalGeneral: totalGeneral,
        filas: items
      };

      try {
        // Enviar datos usando fetch en modo no-cors o enviando JSON formateado
        await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("✅ Datos enviados con éxito a Google Sheets.");
        limpiarFormulario();
      } catch (error) {
        console.error(error);
        alert("❌ Ocurrió un error al guardar los datos.");
      }
    }

    // Consultar Historial desde Google Sheets vía GET
    async function consultarHistorial() {
      const modal = document.getElementById("modal-historial");
      const loading = document.getElementById("loading-historial");
      const tabla = document.getElementById("tabla-historial");
      const headersContainer = document.getElementById("headers-historial");
      const bodyContainer = document.getElementById("body-historial");

      modal.classList.remove("hidden");
      loading.classList.remove("hidden");
      tabla.classList.add("hidden");

      if (URL_APPS_SCRIPT === "TU_URL_DE_APPS_SCRIPT_AQUI" || !URL_APPS_SCRIPT) {
        loading.textContent = "Error: Configura la URL de Google Apps Script.";
        return;
      }

      try {
        const response = await fetch(URL_APPS_SCRIPT);
        const data = await response.json();

        loading.classList.add("hidden");
        tabla.classList.remove("hidden");

        headersContainer.innerHTML = "";
        bodyContainer.innerHTML = "";

        if (data.length === 0) {
          bodyContainer.innerHTML = `<tr><td class="p-4 text-center text-slate-400" colspan="100%">No hay registros guardados.</td></tr>`;
          return;
        }

        // Encabezados
        data[0].forEach(header => {
          headersContainer.innerHTML += `<th class="p-2 border-b">${header}</th>`;
        });

        // Contenido
        for (let i = 1; i < data.length; i++) {
          let trHTML = "<tr class='hover:bg-slate-50'>";
          data[i].forEach(cell => {
            trHTML += `<td class="p-2 border-b text-slate-700">${cell}</td>`;
          });
          trHTML += "</tr>";
          bodyContainer.innerHTML += trHTML;
        }

      } catch (error) {
        console.error(error);
        loading.textContent = "Error al cargar la información de Google Sheets.";
      }
    }

    function cerrarHistorial() {
      document.getElementById("modal-historial").classList.add("hidden");
    }
  </script>
</body>
</html>
