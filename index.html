<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Oficial de Letras CURP desde Excel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 2rem; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4 mx-auto" style="max-width: 800px;">
        <h2 class="mb-4 text-center">Extractor Oficial de Letras CURP</h2>
        <div class="alert alert-info">
            Herramienta configurada para convertir automáticamente cualquier letra <strong>Ñ en X</strong> siguiendo los lineamientos de procesamiento de RENAPO.
        </div>
        
        <div class="mb-3">
            <label class="form-label fw-bold">1. Selecciona el archivo (Excel o CSV):</label>
            <input type="file" class="form-control" id="fileInput" accept=".xlsx, .xls, .csv">
        </div>

        <div id="sheetConfig" class="hidden">
            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label fw-bold">2. Selecciona la Hoja de Trabajo:</label>
                    <select class="form-select" id="sheetSelect"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Fila de encabezados:</label>
                    <input type="number" class="form-control" id="headerRow" value="1" min="1">
                </div>
            </div>
            <button class="btn btn-secondary w-100 mb-4" onclick="loadHeaders()">Cargar Encabezados</button>
        </div>

        <div id="columnMapping" class="hidden">
            <h5 class="fw-bold">3. Configuración de Columnas</h5>
            
            <div class="mb-3">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="colType" id="colSeparate" value="separate" checked onchange="toggleColType()">
                    <label class="form-check-label" for="colSeparate">Columnas Separadas</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="colType" id="colSingle" value="single" onchange="toggleColType()">
                    <label class="form-check-label" for="colSingle">Una Sola Columna (Nombre Completo)</label>
                </div>
            </div>

            <div id="separateCols" class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nombre(s):</label>
                    <select class="form-select col-select" id="colNombre"></select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Apellido Paterno:</label>
                    <select class="form-select col-select" id="colPaterno"></select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Apellido Materno:</label>
                    <select class="form-select col-select" id="colMaterno"></select>
                </div>
            </div>

            <div id="singleCol" class="hidden row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Columna Nombre Completo (Nombres ApellidoP ApellidoM):</label>
                    <select class="form-select col-select" id="colCompleto"></select>
                </div>
            </div>

            <button class="btn btn-primary w-100 mt-3" onclick="processAndDownload()">Procesar y Descargar Archivo</button>
        </div>
    </div>
</div>

<script>
    let workbook = null;
    let currentData = [];

    const stopwords = ['DA','DAS','DE','DEL','DER','DI','DIE','DD','EL','LA','LOS','LAS','LE','LES','MAC','MC','VAN','VON','Y'];
    const excludesNames = ['JOSE', 'MARIA', 'MA', 'MA.', 'J', 'J.', 'SANTO', 'SANTA'];
    const badWords = [
        'BACA', 'BKA', 'BUEI', 'BUEY', 'CACA', 'CACO', 'CAGA', 'CAGO', 'CAKA', 'CAKO', 
        'COGE', 'COGI', 'COGO', 'COLA', 'CULO', 'FETA', 'FEOO', 'LOCA', 'LOCO', 'LOKA', 
        'LOKO', 'MADA', 'MADO', 'MEAR', 'MEAS', 'MEOE', 'MIADO', 'MIADA', 'MOCO', 'MULA', 
        'PEDA', 'PEDO', 'PENE', 'PPIN', 'PUTA', 'PUTO', 'QULO', 'RATA', 'RUIN'
    ];

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            workbook = XLSX.read(data, {type: 'array'});
            
            const sheetSelect = document.getElementById('sheetSelect');
            sheetSelect.innerHTML = '';
            workbook.SheetNames.forEach(sheetName => {
                sheetSelect.innerHTML += `<option value="${sheetName}">${sheetName}</option>`;
            });
            
            document.getElementById('sheetConfig').classList.remove('hidden');
        };
        reader.readAsArrayBuffer(file);
    });

    function loadHeaders() {
        const sheetName = document.getElementById('sheetSelect').value;
        const headerRowIdx = parseInt(document.getElementById('headerRow').value) - 1;
        
        const worksheet = workbook.Sheets[sheetName];
        currentData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
        
        if(currentData.length <= headerRowIdx) {
            alert("La fila de encabezados no existe.");
            return;
        }

        const headers = currentData[headerRowIdx];
        const selects = document.querySelectorAll('.col-select');
        
        selects.forEach(select => {
            select.innerHTML = '<option value="-1">-- Selecciona Columna --</option>';
            headers.forEach((h, idx) => {
                select.innerHTML += `<option value="${idx}">${h || `Columna ${idx+1}`}</option>`;
            });
        });

        document.getElementById('columnMapping').classList.remove('hidden');
    }

    function toggleColType() {
        const isSeparate = document.getElementById('colSeparate').checked;
        document.getElementById('separateCols').classList.toggle('hidden', !isSeparate);
        document.getElementById('singleCol').classList.toggle('hidden', isSeparate);
    }

    function cleanString(str) {
        if (!str) return "";
        return str.toString().trim().toUpperCase()
            .replace(/Ñ/g, "X") // Convertir Ñ a X antes de cualquier otro filtro
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Quitar acentos
            .replace(/[^A-Z ]/g, ""); // Limpiar símbolos especiales
    }

    function getValidTokens(str) {
        let parts = cleanString(str).split(/\s+/);
        return parts.filter(p => p && !stopwords.includes(p));
    }

    function getPrimeraVocalInterna(word) {
        const match = word.substring(1).match(/[AEIOU]/);
        return match ? match[0] : 'X';
    }

    function getPrimeraConsonanteInterna(word) {
        const match = word.substring(1).match(/[BCDFGHJKLMNPQRSTVWXYZ]/);
        return match ? match[0] : 'X';
    }

    function generateCURPLetters(nombres, paterno, materno) {
        let nomTokens = getValidTokens(nombres);
        let patTokens = getValidTokens(paterno);
        let matTokens = getValidTokens(materno);

        let pat = patTokens.length > 0 ? patTokens[0] : "X";
        let letra1 = pat.charAt(0) || 'X';
        let letra2 = getPrimeraVocalInterna(pat);
        let cons1 = getPrimeraConsonanteInterna(pat);

        let mat = matTokens.length > 0 ? matTokens[0] : "X";
        let letra3 = mat === "X" ? "X" : mat.charAt(0);
        let cons2 = getPrimeraConsonanteInterna(mat);

        let nomValid = "X";
        if (nomTokens.length > 0) {
            nomValid = nomTokens[0];
            if (excludesNames.includes(nomValid) && nomTokens.length > 1) {
                nomValid = nomTokens[1];
            }
        }
        let letra4 = nomValid.charAt(0) || 'X';
        let cons3 = getPrimeraConsonanteInterna(nomValid);

        let iniciales4 = `${letra1}${letra2}${letra3}${letra4}`;
        if (badWords.includes(iniciales4)) {
            letra2 = 'X';
        }

        return `${letra1}${letra2}${letra3}${letra4}${cons1}${cons2}${cons3}`;
    }

    function parseFullNameAndGenerate(fullName) {
        const tokens = getValidTokens(fullName);
        if (tokens.length >= 3) {
            let mat = tokens.pop();
            let pat = tokens.pop();
            let nom = tokens.join(" ");
            return generateCURPLetters(nom, pat, mat);
        } else if (tokens.length === 2) {
            return generateCURPLetters(tokens[0], tokens[1], "");
        } else if (tokens.length === 1) {
            return generateCURPLetters(tokens[0], "", "");
        }
        return "XXXXXXX";
    }

    function processAndDownload() {
        const isSeparate = document.getElementById('colSeparate').checked;
        const headerRowIdx = parseInt(document.getElementById('headerRow').value) - 1;
        
        let cNom = -1, cPat = -1, cMat = -1, cFull = -1;

        if (isSeparate) {
            cNom = parseInt(document.getElementById('colNombre').value);
            cPat = parseInt(document.getElementById('colPaterno').value);
            cMat = parseInt(document.getElementById('colMaterno').value);
            if (cNom === -1 || cPat === -1) return alert("Selecciona al menos Nombre y Apellido Paterno");
        } else {
            cFull = parseInt(document.getElementById('colCompleto').value);
            if (cFull === -1) return alert("Selecciona la columna de Nombre Completo");
        }

        const newColIdx = currentData[headerRowIdx].length;
        currentData[headerRowIdx][newColIdx] = "LETRAS_CURP";

        for (let i = headerRowIdx + 1; i < currentData.length; i++) {
            let row = currentData[i];
            while(row.length <= newColIdx) row.push("");

            let curpLetters = "";

            if (isSeparate) {
                let n = row[cNom] || "";
                let p = row[cPat] || "";
                let m = (cMat !== -1) ? (row[cMat] || "") : "";
                if (n || p) {
                    curpLetters = generateCURPLetters(n, p, m);
                }
            } else {
                let f = row[cFull] || "";
                if (f) {
                    curpLetters = parseFullNameAndGenerate(f);
                }
            }

            row[newColIdx] = curpLetters;
        }

        const newSheet = XLSX.utils.aoa_to_sheet(currentData);
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, newSheet, "Procesado");
        
        XLSX.writeFile(newWorkbook, "Datos_CURP_Procesados.xlsx");
    }
</script>
</body>
</html>
